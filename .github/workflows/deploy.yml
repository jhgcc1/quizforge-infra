name: Deploy

# Deploy the MAIN of both repositories. There is nothing to type: the tags are resolved here.
#   api  = the newest commit of jhgcc1/quizforge main whose required checks are green and whose images are in ECR
#   web  = the newest commit of jhgcc1/quizforge-web main whose required checks are green and whose image is in ECR
# Going back to an older version is a different operation with a different name: see rollback.yml.
#
#   scope  all = api, worker, scorer, redteam, migrate and web;  api = everything but the web;  web = only the web.
#
# PULL deploy: this repository decides what goes to production and when; the code and front end repositories only publish
# images to ECR. No cross-repository tokens: their checks are read through the public API, the images through the AWS role.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to deploy (always the main of that side)"
        type: choice
        options: [all, api, web]
        default: all

permissions:
  contents: read

env:
  CODE_REPO: jhgcc1/quizforge
  WEB_REPO: jhgcc1/quizforge-web
  # the checks that must be green on the commit being deployed, in each repository.
  # The code repository has no `e2e`: the browser test belongs to the front end's CI, which runs it against this
  # repository's main (jhgcc1/quizforge#101). What covers the deployed pair here is the smoke step in apply.yml,
  # which drives the real stack in a browser after the apply, with rollback.yml to go back.
  REQUIRED_CHECKS: "quality integration migrations docker-build promptfoo llm-eval"
  WEB_REQUIRED_CHECKS: "quality build e2e docker-build secrets-scan"
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
  TF_VAR_paused: ${{ vars.PAUSED || 'false' }}

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: resolve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write # OIDC: the READ-ONLY plan role (the deploy role is only for the approved job)
      contents: read
    outputs:
      image_tag: ${{ steps.pick.outputs.image_tag }}
      web_tag: ${{ steps.pick.outputs.web_tag }}
      scope: ${{ steps.pick.outputs.scope }}
    steps:
      - name: Refuse to deploy while the environment is paused
        run: |
          if [ "${{ vars.PAUSED }}" = "true" ]; then
            echo "::error::The environment is PAUSED (database stopped, no NAT, services at 0). Run scripts/resume.sh first, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.x", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve the main of each side and verify the images exist in ECR
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          IN_SCOPE: ${{ inputs.scope }}
        run: |
          tag_of() { aws ecs describe-task-definition --task-definition "$1" --query 'taskDefinition.containerDefinitions[0].image' --output text | cut -d: -f2; }
          have() { aws ecr describe-images --repository-name "quizforge/$1" --image-ids "imageTag=$2" >/dev/null 2>&1; } # <service> <tag>
          current_api=$(tag_of quizforge-prod-api); current_web=$(tag_of quizforge-prod-web)
          echo "running now: api/worker ${current_api:0:12}, web $current_web"
          scope=${IN_SCOPE:-all}

          # The newest commit of a repository's main that is green AND whose images are already in ECR. $1 repo, $2 checks,
          # $3 how the tag is built from the sha (identity for the back end, web-<12> for the front end), $4.. services to find.
          newest_green() {
            local repo=$1 checks=$2 shape=$3; shift 3
            local sha tag runs ok
            for sha in $(gh api "repos/$repo/commits?sha=main&per_page=30" --jq '.[].sha'); do
              runs=$(gh api "repos/$repo/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | {(.name): .conclusion}] | add // {}')
              ok=1; for job in $checks; do [ "$(jq -r --arg j "$job" '.[$j] // "missing"' <<< "$runs")" = success ] || { ok=0; break; }; done
              [ $ok = 1 ] || { echo "  ${sha:0:7}: checks not all green" >&2; continue; }
              if [ "$shape" = web ]; then tag="web-${sha:0:12}"; else tag="$sha"; fi
              for s in "$@"; do have "$s" "$tag" || { ok=0; echo "  ${sha:0:7}: green, but quizforge/$s:$tag is not in ECR (yet)" >&2; break; }; done
              [ $ok = 1 ] || continue
              echo "$tag"; return 0
            done
            return 1
          }

          if [ "$scope" = web ]; then
            image_tag=$current_api # the other services keep what runs now
          else
            echo "looking for the newest green commit of $CODE_REPO main..."
            image_tag=$(newest_green "$CODE_REPO" "$REQUIRED_CHECKS" sha api worker redteam) \
              || { echo "::error::no commit among the last 30 of $CODE_REPO main is green with its images in ECR"; exit 1; }
          fi

          if [ "$scope" = api ]; then
            web_tag=$current_web # the front end keeps what runs now
          else
            echo "looking for the newest green commit of $WEB_REPO main..."
            web_tag=$(newest_green "$WEB_REPO" "$WEB_REQUIRED_CHECKS" web web) \
              || { echo "::error::no commit among the last 30 of $WEB_REPO main is green with its image in ECR"; exit 1; }
          fi

          { echo "image_tag=$image_tag"; echo "web_tag=$web_tag"; echo "scope=$scope"; } >> "$GITHUB_OUTPUT"
          same() { [ "$1" = "$2" ] && echo "unchanged" || echo "**new**"; }
          {
            echo "### Deploy request (main of each side)"
            echo "| | now | requested | |"; echo "|---|---|---|---|"
            echo "| api, worker, scorer, redteam, migrate | \`${current_api:0:12}\` | \`${image_tag:0:12}\` | $(same "$current_api" "$image_tag") |"
            echo "| web | \`$current_web\` | \`$web_tag\` | $(same "$current_web" "$web_tag") |"
            echo; echo "scope: **$scope**. Images verified in ECR."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Plan preview (read-only role, placeholders for the social login secrets)
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ steps.pick.outputs.image_tag }}
          WEB_TAG: ${{ steps.pick.outputs.web_tag }}
          SCOPE: ${{ steps.pick.outputs.scope }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=quizforge/prod/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true" -backend-config="encrypt=true" >/dev/null
          targets=(); [ "$SCOPE" = web ] && targets=(-target=aws_ecs_task_definition.web -target=aws_ecs_service.web)
          terraform plan -input=false -lock=false -no-color -var "image_tag=$IMAGE_TAG" -var "web_image_tag=$WEB_TAG" "${targets[@]}" > preview.txt 2>&1 || { tail -40 preview.txt; exit 1; }
          { echo; echo '<details><summary>Plan preview</summary>'; echo; echo '```'; grep -vE "Refreshing state|Reading\.\.\.|Read complete" preview.txt | tail -c 30000; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: resolve
    uses: ./.github/workflows/apply.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    with:
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      web_tag: ${{ needs.resolve.outputs.web_tag }}
      scope: ${{ needs.resolve.outputs.scope }}
